const seedTx=[
{id:uid(),type:'out',productId:'p2',qty:2,date:new Date(Date.now()-86400000).toISOString(),note:'Customer sale'},
{id:uid(),type:'in',productId:'p1',qty:10,date:new Date(Date.now()-2*86400000).toISOString(),note:'Supplier restock'},
{id:uid(),type:'out',productId:'p4',qty:5,date:new Date(Date.now()-3*86400000).toISOString(),note:'Customer sale'},
{id:uid(),type:'out',productId:'p5',qty:1,date:new Date(Date.now()-4*86400000).toISOString(),note:'Customer sale'}
];
const DEFAULT={setup:null,products:[],transactions:[],theme:'light',demo:false,tourSeen:false};
let state=load();let currentPage='dashboard';let inventorySearch='';let inventoryCategory='all';let settingsTab='general';let onboardingStep=0;
function load(){
  try{
    const raw=localStorage.getItem('tallyo_state');
    if(!raw)return structuredClone(DEFAULT);
    const x=JSON.parse(raw);
    if(!x||typeof x!=='object')return structuredClone(DEFAULT);
    return {
      ...structuredClone(DEFAULT),
      ...x,
      products:Array.isArray(x.products)?x.products:[],
      transactions:Array.isArray(x.transactions)?x.transactions:[]
    };
  }catch{return structuredClone(DEFAULT)}
}
function save(){localStorage.setItem('tallyo_state',JSON.stringify(state))}
function applyTheme(){document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2400)}
function icon(n){return ICONS[n]||''}
function render(){
  applyTheme();
  // A brand-new install always starts here. Once setup is saved, TallyO
  // goes straight back to the app and restores the saved products/settings.
  if(!state.setup){renderOnboarding();return}
  renderApp();
}
function renderOnboarding(){document.getElementById('app').innerHTML=`<div class="screen onboarding"><div class="brand"><span class="logo">${icon('box')}</span>TallyO</div><div class="ob-content">${onboardingStep===0?`<div class="ob-visual"><div class="ob-icon">${icon('box')}</div></div><div class="eyebrow">Made for everyday business</div><h1>Know what you have.<br>Sell with confidence.</h1><p>TallyO keeps your products, purchases and sales in one simple place. No accounting jargon. Just the things you need to run your business.</p>`:`<div class="ob-visual"><div class="ob-icon">${icon('check')}</div></div><div class="eyebrow">Let's get you started</div><h1>Tell us your<br>business name.</h1><p>That's it. You can add products as you go. If you want TallyO to use a different setup later, you can change it in Settings.</p><div style="height:18px"></div><div class="form-grid"><div class="field full-field"><label>WHAT SHOULD WE CALL YOUR BUSINESS?</label><input id="obBusiness" placeholder="e.g. Ebuka Accessories" value="${esc(state._draftName||'')}" oninput="state._draftName=this.value"></div><div class="field full-field"><label>HOW DO YOU WANT TO START?</label><select id="obData"><option value="empty">Start with an empty shop</option><option value="demo">Show me around with sample products</option></select></div></div>`}<div class="dots"><span class="dot ${onboardingStep===0?'active':''}"></span><span class="dot ${onboardingStep===1?'active':''}"></span></div></div><div class="ob-actions">${onboardingStep>0?`<button class="secondary" onclick="onboardingBack()">Back</button>`:''}<button class="primary" onclick="onboardingNext()">${onboardingStep===1?'Open my TallyO':'Show me how it works '+icon('arrow')}</button></div></div>`}
function onboardingNext(){
  if(onboardingStep===0){onboardingStep=1;renderOnboarding();return}
  const name=(state._draftName||'').trim()||'My Business';
  const demo=document.getElementById('obData')?.value==='demo';
  state.setup={businessName:name,businessType:'retail',currency:'NGN'};
  delete state._draftName;
  if(demo){
    state.products=structuredClone(seedProducts);
    state.transactions=structuredClone(seedTx);
    state.demo=true;
  }else{
    state.products=[];
    state.transactions=[];
    state.demo=false;
  }
  save();
  currentPage='dashboard';
  onboardingStep=0;
  render();
  toast('You are ready to go');
}
function onboardingBack(){if(onboardingStep>0){onboardingStep--;renderOnboarding()}}
function renderApp(){document.getElementById('app').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="side-brand"><div class="brand"><span class="logo">${icon('box')}</span>TallyO</div></div>${navHtml()}<div class="sidebar-bottom"><button class="nav quick-side" data-tour="quick" onclick="openQuickActions()">${icon('plus')}<span>What do you want to do?</span></button></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px;min-width:0"><button class="icon-btn mobile-menu" data-tour="menu" onclick="openMobileMenu()">${icon('menu')}</button><div class="topbar-title">${pageTitle()}</div></div><div class="top-actions">${state.demo?'<span class="demo-pill">DEMO MODE</span>':''}<button class="icon-btn" data-tour="theme" onclick="toggleTheme()" title="Toggle theme">${icon(state.theme==='dark'?'sun':'moon')}</button><button class="icon-btn" data-tour="quick" onclick="openQuickActions()">${icon('plus')}</button></div></header><div class="content">${pageHtml()}</div></main></div><nav class="mobile-nav">${mobileNav()}</nav><div id="tourLayer"></div>`;if(!state.tourSeen)setTimeout(startTour,180)}
function navHtml(){return `<nav class="nav">${[['dashboard','home','Home'],['inventory','box','Products'],['transactions','activity','Sales & buys'],['reports','trend','Reports'],['settings','settings','Settings']].map(x=>`<button class="${currentPage===x[0]?'active':''}" onclick="go('${x[0]}')">${icon(x[1])}<span>${x[2]}</span></button>`).join('')}</nav>`}
function mobileNav(){return [['dashboard','home','Home'],['inventory','box','Products'],['transactions','activity','Sales & buys'],['reports','trend','Reports'],['settings','settings','Settings']].map(x=>`<button class="${currentPage===x[0]?'active':''}" onclick="go('${x[0]}')">${icon(x[1])}<span>${x[2]}</span></button>`).join('')}
function pageTitle(){return ({dashboard:'Home',inventory:'Products',transactions:'Sales & buys',reports:'Reports',settings:'Settings'})[currentPage]}
function go(p){currentPage=p;inventorySearch='';render()}
function productById(id){return state.products.find(p=>p.id===id)}
function totals(){const stockValue=state.products.reduce((s,p)=>s+p.qty*p.cost,0);const retailValue=state.products.reduce((s,p)=>s+p.qty*p.price,0);const low=state.products.filter(p=>p.qty<=p.threshold).length;const units=state.products.reduce((s,p)=>s+p.qty,0);return {stockValue,retailValue,low,units}}
function pageHtml(){if(currentPage==='dashboard')return dashboardHtml();if(currentPage==='inventory')return inventoryHtml();if(currentPage==='transactions')return transactionsHtml();if(currentPage==='reports')return reportsHtml();return settingsHtml()}
function dashboardHtml(){const t=totals();const recent=[...state.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);const low=state.products.filter(p=>p.qty<=p.threshold).slice(0,5);return `<section class="page active"><div class="welcome"><div><div class="eyebrow">${new Date().toLocaleDateString('en-NG',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Hello, ${esc(state.setup.businessName)} 👋</h1><div class="muted">Here’s what’s happening with your business today.</div></div><button class="primary" style="flex:none" onclick="openProductModal()">${icon('plus')} Add product</button></div><div class="stats"><div class="stat"><div class="stat-top">Money in products <span class="stat-icon">${icon('box')}</span></div><div class="stat-value">${money(t.stockValue)}</div><div class="stat-foot">What your current products cost you</div></div><div class="stat"><div class="stat-top">Could sell for <span class="stat-icon">${icon('trend')}</span></div><div class="stat-value">${money(t.retailValue)}</div><div class="stat-foot">Value if everything sells</div></div><div class="stat"><div class="stat-top">Items you have <span class="stat-icon">${icon('activity')}</span></div><div class="stat-value">${t.units.toLocaleString()}</div><div class="stat-foot">Across ${state.products.length} products</div></div><div class="stat"><div class="stat-top">Running low <span class="stat-icon">${icon('warning')}</span></div><div class="stat-value">${t.low}</div><div class="stat-foot">Products you may need to buy soon</div></div></div><div class="grid2"><div class="card"><div class="card-head"><h2>What you've been doing</h2><button class="btn-small" onclick="go('transactions')">View all ${icon('arrow')}</button></div><div class="card-body">${recent.length?`<div class="list">${recent.map(txRow).join('')}</div>`:emptyHtml('No activity yet','Your purchases and sales will appear here.','activity')}</div></div><div class="card"><div class="card-head"><h2>Worth checking</h2><button class="btn-small" onclick="go('inventory')">Inventory</button></div><div class="card-body">${low.length?`<div class="list">${low.map(p=>`<div class="row"><div class="row-main"><div class="avatar">${esc(p.name.slice(0,1).toUpperCase())}</div><div><div class="row-title">${esc(p.name)}</div><div class="row-sub">${p.qty} ${esc(p.unit)} left · threshold ${p.threshold}</div></div></div><span class="badge red">Low</span></div>`).join('')}</div>`:emptyHtml('Everything looks good','Nothing is running low right now.','check')}</div></div></div></section>`}
function emptyHtml(title,sub,ico='box'){return `<div class="empty"><div class="empty-icon">${icon(ico)}</div><strong>${title}</strong><div style="margin-top:5px;font-size:13px">${sub}</div></div>`}
function txRow(tx){const p=productById(tx.productId);return `<div class="row"><div class="row-main"><div class="avatar">${tx.type==='in'?'+':'−'}</div><div><div class="row-title">${tx.type==='in'?'Buy':'Sell'} · ${esc(p?.name||'Deleted product')}</div><div class="row-sub">${fmtDate(tx.date)}${tx.note?' · '+esc(tx.note):''}</div></div></div><span class="badge ${tx.type==='in'?'green':'blue'}">${tx.type==='in'?'+':'−'}${tx.qty}</span></div>`}
function inventoryHtml(){let arr=state.products.filter(p=>(inventoryCategory==='all'||p.category===inventoryCategory)&&((p.name+' '+p.category+' '+(p.sku||'')).toLowerCase().includes(inventorySearch.toLowerCase())));const cats=[...new Set(state.products.map(p=>p.category))];return `<section class="page active"><div class="welcome"><div><div class="eyebrow">${state.products.length} products</div><h1>Inventory</h1><div class="muted">Everything you have available to sell.</div></div><button class="primary" style="flex:none" onclick="openProductModal()">${icon('plus')} Add product</button></div><div class="toolbar"><div class="search">${icon('search')}<input value="${esc(inventorySearch)}" oninput="inventorySearch=this.value;render()" placeholder="Search your products..."></div><select class="btn-small select" onchange="inventoryCategory=this.value;render()"><option value="all">All types</option>${cats.map(c=>`<option ${inventoryCategory===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select><button class="btn-small" onclick="openStockModal('in')">+ Buy</button><button class="btn-small" onclick="openStockModal('out')">− Sell</button></div>${arr.length?`<div class="product-grid">${arr.map(productCard).join('')}</div>`:emptyHtml('No products found','Try a different search or add your first product.','search')}</section>`}
function productCard(p){const low=p.qty<=p.threshold;return `<article class="product-card product-clickable" onclick="openProductOverview('${p.id}')"><div class="product-top"><div class="product-img">${p.image?`<img src="${p.image}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:esc(p.name.slice(0,2).toUpperCase())}</div><button class="icon-btn" onclick="event.stopPropagation();openProductMenu('${p.id}')">•••</button></div><div class="product-name">${esc(p.name)}</div><div class="product-meta">${esc(p.category)} ${p.sku?'· '+esc(p.sku):''}</div><div class="product-bottom"><div><div class="price">${money(p.price)}</div><div class="qty">Bought for ${money(p.cost)} each</div></div><span class="badge ${low?'red':'green'}">${p.qty} ${esc(p.unit)}${low?' · low':''}</span></div><div class="product-hint">Tap to see details</div></article>`}
function transactionsHtml(){const arr=[...state.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));return `<section class="page active"><div class="welcome"><div><div class="eyebrow">Sales & buys</div><h1>Transactions</h1><div class="muted">Keep track of the products you buy and sell.</div></div><button class="primary" style="flex:none" onclick="openStockModal()">${icon('plus')} Record a sale or buy</button></div><div class="card"><div class="card-body">${arr.length?`<div class="list">${arr.map(tx=>{const p=productById(tx.productId);return `<div class="row"><div class="row-main"><div class="avatar">${tx.type==='in'?'+':'−'}</div><div><div class="row-title">${esc(p?.name||'Deleted product')}</div><div class="row-sub">${tx.type==='in'?'Buy':'Sell'} · ${fmtDate(tx.date)}${tx.note?' · '+esc(tx.note):''}</div></div></div><span class="badge ${tx.type==='in'?'green':'blue'}">${tx.type==='in'?'+':'−'}${tx.qty}</span></div>`}).join('')}</div>`:emptyHtml('No transactions yet','Your purchases and sales will show up here.','activity')}</div></div></section>`}
function reportsHtml(){const t=totals();const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*86400000);const key=d.toISOString().slice(0,10);const out=state.transactions.filter(x=>x.type==='out'&&x.date.slice(0,10)===key).reduce((s,x)=>s+x.qty,0);days.push({label:d.toLocaleDateString('en',{weekday:'short'}),value:out})}const max=Math.max(1,...days.map(x=>x.value));const top=[...state.products].sort((a,b)=>(b.qty*b.price)-(a.qty*a.price)).slice(0,5);return `<section class="page active"><div class="welcome"><div><div class="eyebrow">A quick look at your numbers</div><h1>Reports</h1><div class="muted">Simple numbers to help you see how your shop is doing.</div></div></div><div class="stats"><div class="stat"><div class="stat-top">What your products cost <span class="stat-icon">${icon('box')}</span></div><div class="stat-value">${money(t.stockValue)}</div></div><div class="stat"><div class="stat-top">Could make from current products <span class="stat-icon">${icon('trend')}</span></div><div class="stat-value">${money(t.retailValue)}</div></div><div class="stat"><div class="stat-top">Possible gross margin <span class="stat-icon">${icon('activity')}</span></div><div class="stat-value">${money(t.retailValue-t.stockValue)}</div></div><div class="stat"><div class="stat-top">Running-low rate <span class="stat-icon">${icon('warning')}</span></div><div class="stat-value">${state.products.length?Math.round(t.low/state.products.length*100):0}%</div></div></div><div class="grid2"><div class="card"><div class="card-head"><h2>Units sold — last 7 days</h2></div><div class="card-body"><div class="chart">${days.map(d=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(4,d.value/max*160)}px" title="${d.value} units"></div><div class="bar-label">${d.label}</div></div>`).join('')}</div></div></div><div class="card"><div class="card-head"><h2>Where your money is</h2></div><div class="card-body">${top.length?`<div class="list">${top.map(p=>`<div class="row"><div><div class="row-title">${esc(p.name)}</div><div class="row-sub">${p.qty} units · ${money(p.qty*p.price)} retail value</div></div><span class="badge blue">${Math.round((p.qty*p.price)/(t.retailValue||1)*100)}%</span></div>`).join('')}</div>`:emptyHtml('Nothing to report','Add products to see inventory analytics.','trend')}</div></div></div></section>`}
function settingsHtml(){return `<section class="page active"><div class="welcome"><div><div class="eyebrow">Preferences</div><h1>Settings</h1><div class="muted">A few things you can change whenever you need to.</div></div></div><div class="settings-grid"><div class="card settings-nav">${[['general','Business'],['appearance','How TallyO looks'],['data','Demo & backup']].map(x=>`<button class="${settingsTab===x[0]?'active':''}" onclick="settingsTab='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div class="card"><div class="card-body">${settingsTab==='general'?generalSettings():settingsTab==='appearance'?appearanceSettings():dataSettings()}</div></div></div></section>`}
function generalSettings(){return `<div class="card-head" style="padding:0 0 12px"><h2>About your business</h2></div><div class="form-grid"><div class="field full-field"><label>BUSINESS NAME</label><input id="businessName" value="${esc(state.setup.businessName)}"></div><div class="field"><label>WHAT KIND OF BUSINESS IS THIS?</label><select id="businessType">${[['retail','General retail'],['fashion','Fashion & clothing'],['accessories','Phone accessories'],['food','Food & provisions'],['beauty','Beauty & cosmetics'],['farming','Farming & produce'],['electronics','Electronics'],['other','Other']].map(x=>`<option value="${x[0]}" ${state.setup.businessType===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>MONEY IS SHOWN IN</label><select id="currency"><option value="NGN">Nigerian Naira (₦)</option><option value="USD">US Dollar ($)</option><option value="GBP">British Pound (£)</option></select></div></div><div class="modal-actions"><button class="primary" style="flex:none" onclick="saveBusinessSettings()">Save</button></div>`}

function dataSettings(){return `<div class="card-head" style="padding:0 0 12px"><h2>Demo & backup</h2></div><div class="setting-row"><div class="setting-label"><strong>${state.demo?'Demo mode is active':'Demo mode'}</strong><span>${state.demo?'You are working with sample data. Exit to clear it and start fresh.':'Load sample inventory so you can explore TallyO.'}</span></div>${state.demo?'<button class="danger" onclick="exitDemo()">Exit demo</button>':'<button class="secondary" onclick="startDemo()">Start demo</button>'}</div><div class="setting-row"><div class="setting-label"><strong>Keep a backup</strong><span>Save a copy of your TallyO data on this device.</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="secondary" onclick="exportData()">Save backup</button><button class="secondary" onclick="document.getElementById('backupFile').click()">Import backup</button><input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></div></div><div class="setting-row"><div class="setting-label"><strong>Start TallyO over</strong><span>This clears your TallyO data from this browser.</span></div><button class="danger" onclick="confirmReset()">Reset</button></div>`}

function openModal(title,body,actions=''){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">${icon('close')}</button></div><div class="modal-body">${body}${actions}</div></div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modal').innerHTML=''}
function unitOptions(type,current=''){
  const groups={
    retail:['pieces','packs','pairs','sets','boxes','cartons','dozens'],
    fashion:['pieces','pairs','sets','packs','dozens'],
    accessories:['pieces','packs','pairs','sets','boxes','cartons'],
    food:['pieces','packs','bags','sacks','baskets','cups','bottles','jars','trays','crates','cartons','kg','grams','litres'],
    beauty:['pieces','bottles','jars','tubes','packs','boxes','sets'],
    farming:['pieces','bunches','bags','sacks','baskets','crates','boxes','kg','grams','litres'],
    electronics:['pieces','pairs','sets','boxes','packs','cartons'],
    other:['pieces','packs','pairs','sets','boxes','bags','baskets','bottles','kg','litres']
  };
  const units=groups[type]||groups.other;
  if(current && !units.includes(current))units.unshift(current);
  return units.map(u=>`<option value="${esc(u)}" ${current===u?'selected':''}>${esc(u.charAt(0).toUpperCase()+u.slice(1))}</option>`).join('')+`<option value="__custom__" ${current && !units.includes(current)?'selected':''}>Something else…</option>`;
}
function unitStep(unit){return ['kg','grams','litres'].includes(unit)?'0.01':'1'}

  if(!p || !['pieces','packs','pairs','sets','boxes','cartons','dozens','bags','sacks','baskets','cups','bottles','jars','trays','crates','kg','grams','litres','bunches','tubes'].includes(currentUnit)){handleUnitChange()}
}
function handleUnitChange(){const select=document.getElementById('fUnit');const custom=document.getElementById('fCustomUnit');const qty=document.getElementById('fQty');const threshold=document.getElementById('fThreshold');if(!select)return;const isCustom=select.value==='__custom__';if(custom)custom.classList.toggle('hidden',!isCustom);const unit=isCustom?(custom?.value.trim()||'pieces'):select.value;const step=unitStep(unit);if(qty)qty.step=step;if(threshold)threshold.step=step}
function defaultUnit(){return ({food:'packs',beauty:'bottles',farming:'bags',fashion:'pieces',accessories:'pieces',electronics:'pieces',retail:'pieces'})[state.setup.businessType]||'pieces'}
function saveProduct(id){const name=document.getElementById('fName').value.trim();if(!name){toast('Product name is required');return}const unitSelect=document.getElementById('fUnit');const customUnit=document.getElementById('fCustomUnit');let unit=unitSelect?.value==='__custom__'?(customUnit?.value.trim()||'pieces'):(unitSelect?.value||'pieces');const data={name,category:document.getElementById('fCategory').value.trim()||'General',sku:document.getElementById('fSku').value.trim(),qty:Math.max(0,Number(document.getElementById('fQty').value)||0),unit, cost:Math.max(0,Number(document.getElementById('fCost').value)||0),price:Math.max(0,Number(document.getElementById('fPrice').value)||0),threshold:Math.max(0,Number(document.getElementById('fThreshold').value)||0),note:document.getElementById('fNote').value.trim(),image:document.getElementById('fImageData').value};if(id){Object.assign(productById(id),data);toast('Product updated')}else{const p={id:uid(),...data};state.products.unshift(p);toast('Product added')}save();closeModal();render()}
function previewProductImage(event){const file=event.target.files?.[0];if(!file)return;if(file.size>2*1024*1024){toast('Image must be under 2 MB');event.target.value='';return}const reader=new FileReader();reader.onload=()=>{document.getElementById('fImageData').value=reader.result;const box=document.getElementById('imagePreview');box.style.display='block';box.innerHTML='<img src="'+reader.result+'" alt="Preview" style="width:84px;height:84px;object-fit:cover;border-radius:16px;border:1px solid var(--line)">'};reader.readAsDataURL(file)}
function openProductOverview(id){const p=productById(id);if(!p)return;const tx=[...state.transactions].filter(x=>x.productId===id).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);const bought=state.transactions.filter(x=>x.productId===id&&x.type==='in').reduce((n,x)=>n+x.qty,0);const sold=state.transactions.filter(x=>x.productId===id&&x.type==='out').reduce((n,x)=>n+x.qty,0);openModal(p.name,`<div class="product-overview"><div class="overview-hero"><div class="overview-image">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:esc(p.name.slice(0,2).toUpperCase())}</div><div><div class="eyebrow">${esc(p.category)}</div><h2>${esc(p.name)}</h2><div class="muted">${p.sku?'Code: '+esc(p.sku)+' · ':''}${p.qty} ${esc(p.unit)} available</div></div></div><div class="overview-actions"><button class="primary" onclick="closeModal();quickAdjustProduct('${id}','in')">+ Add 1</button><button class="secondary" onclick="closeModal();quickAdjustProduct('${id}','out')">− Remove 1</button></div><div class="overview-stats"><div><strong>${p.qty}</strong><span>Available</span></div><div><strong>${bought}</strong><span>Bought</span></div><div><strong>${sold}</strong><span>Sold</span></div><div><strong>${money(p.qty*p.price)}</strong><span>Sales value</span></div></div><div class="overview-section"><h3>What you've been doing</h3>${tx.length?tx.map(x=>`<div class="row"><div class="row-main"><div class="avatar">${x.type==='in'?'+':'−'}</div><div><div class="row-title">${x.type==='in'?'Bought':'Sold'} ${x.qty} ${esc(p.unit)}</div><div class="row-sub">${fmtDate(x.date)}${x.note?' · '+esc(x.note):''}</div></div></div><span class="badge ${x.type==='in'?'green':'blue'}">${x.type==='in'?'+':'−'}${x.qty}</span></div>`).join(''):`<div class="muted">No purchases or sales recorded yet.</div>`}</div><div class="overview-section"><h3>Prices & reminder</h3><div class="price-line"><span>You bought it for</span><strong>${money(p.cost)}</strong></div><div class="price-line"><span>You sell for</span><strong>${money(p.price)}</strong></div><div class="price-line"><span>Remind me at</span><strong>${p.threshold} ${esc(p.unit)}</strong></div></div></div>`,`<div class="modal-actions"><button class="secondary" onclick="closeModal();openProductModal('${id}')">Edit product</button><button class="primary" style="flex:none" onclick="closeModal()">Done</button></div>`)}
function openProductMenu(id){const p=productById(id);openModal(p.name,`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn-small" onclick="closeModal();openProductModal('${id}')">${icon('edit')} Edit</button><button class="btn-small" onclick="closeModal();openStockModal('in','${id}')">+ Buy</button><button class="btn-small" onclick="closeModal();openStockModal('out','${id}')">− Sell</button><button class="danger" onclick="closeModal();confirmDeleteProduct('${id}')">${icon('trash')} Delete</button></div><div style="margin-top:20px;padding:16px;background:var(--surface2);border-radius:16px"><strong>${p.qty} ${esc(p.unit)}</strong><div class="muted" style="font-size:12px;margin-top:5px">${money(p.cost)} cost · ${money(p.price)} selling price · low at ${p.threshold}</div></div>`)}
function confirmDeleteProduct(id){const p=productById(id);openModal('Delete product',`<div class="confirm-box"><div class="warning">${icon('warning')}</div><strong>Delete ${esc(p.name)}?</strong><div class="muted" style="margin-top:7px">This removes the product from your inventory. Existing transaction history will remain.</div></div>`,`<div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="danger" onclick="deleteProduct('${id}')">Delete product</button></div>`)}
function deleteProduct(id){state.products=state.products.filter(p=>p.id!==id);save();closeModal();render();toast('Product deleted')}
function openStockModal(type='in',preId=''){if(!state.products.length){toast('Add a product first');return}const selling=type==='out';openModal(selling?'Sell':'Buy',`<div class="purchase-intro"><div class="action-icon">${selling?icon('cart'):icon('plus')}</div><div><strong>${selling?'Record a sale':'Record a buy'}</strong><div class="muted">${selling?'Take from the quantity when a customer buys this product.':'Add to the quantity when you buy or receive this product.'}</div></div></div><div class="form-grid"><div class="field"><label>WHAT ARE YOU DOING?</label><select id="txType" onchange="updateTransactionMode()"><option value="in" ${!selling?'selected':''}>Buying / receiving</option><option value="out" ${selling?'selected':''}>Selling</option></select></div><div class="field"><label>PRODUCT</label><select id="txProduct">${state.products.map(p=>`<option value="${p.id}" ${preId===p.id?'selected':''}>${esc(p.name)} · ${p.qty} ${esc(p.unit)} available</option>`).join('')}</select></div><div class="field"><label id="txQtyLabel">${selling?'HOW MANY DID YOU SELL?':'HOW MANY DID YOU BUY?'}</label><input id="txQty" type="number" min="1" value="1"></div><div class="field"><label>DATE</label><input id="txDate" type="date" value="${today()}"></div><div class="field full-field"><label>ANYTHING TO REMEMBER?</label><input id="txNote" placeholder="e.g. Supplier, customer, or why you changed it"></div></div>`,`<div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" style="flex:none" onclick="saveTransaction()">${selling?'Record sale':'Record buy'}</button></div>`)}
function updateTransactionMode(){const sell=document.getElementById('txType')?.value==='out';const label=document.getElementById('txQtyLabel');if(label)label.textContent=sell?'HOW MANY DID YOU SELL?':'HOW MANY DID YOU BUY?';const title=document.querySelector('#modal .modal-head h2');if(title)title.textContent=sell?'Sell':'Buy';const intro=document.querySelector('#modal .purchase-intro strong');if(intro)intro.textContent=sell?'Record a sale':'Record a buy'}
function saveTransaction(type){const mode=type||document.getElementById('txType')?.value||'in';const p=productById(document.getElementById('txProduct').value);if(!p)return;const qty=Math.max(1,Number(document.getElementById('txQty').value)||1);if(mode==='out'&&qty>p.qty){toast(`You only have ${p.qty} ${p.unit} available`);return}p.qty+=mode==='in'?qty:-qty;state.transactions.push({id:uid(),type:mode,productId:p.id,qty,date:new Date(document.getElementById('txDate').value+'T12:00:00').toISOString(),note:document.getElementById('txNote').value.trim()});save();closeModal();render();toast(mode==='in'?`Bought ${qty} ${p.unit} of ${p.name}`:`Sold ${qty} ${p.unit} of ${p.name}`)}
function quickAdjustProduct(id,type){const p=productById(id);if(!p)return;if(type==='out'&&p.qty<1){toast(`${p.name} is already at 0`);return}p.qty+=type==='in'?1:-1;state.transactions.push({id:uid(),type,productId:p.id,qty:1,date:new Date().toISOString(),note:'Quick update'});save();render();toast(type==='in'?`Added 1 ${p.unit} of ${p.name}`:`Removed 1 ${p.unit} of ${p.name}`)}
function openQuickActions(){openModal('What do you want to do?',`<div style="display:grid;gap:10px"><button class="btn-small" style="text-align:left;padding:17px" onclick="closeModal();openProductModal()"><strong>Add product</strong><div class="muted">Add something you sell</div></button><button class="btn-small" style="text-align:left;padding:17px" onclick="closeModal();openStockModal('in')"><strong>Buy</strong><div class="muted">Tell TallyO you bought or received products</div></button><button class="btn-small" style="text-align:left;padding:17px" onclick="closeModal();openStockModal('out')"><strong>Sell</strong><div class="muted">Tell TallyO when you sell something</div></button></div>`)}
function openMobileMenu(){openModal('Menu',`${navHtml()}`)}
function startDemo(){state.products=structuredClone(seedProducts);state.transactions=structuredClone(seedTx);state.demo=true;save();render();toast('Demo mode started')}
function exitDemo(){openModal('Exit demo mode',`<div class="confirm-box"><div class="warning">${icon('warning')}</div><strong>Start with a clean inventory?</strong><div class="muted" style="margin-top:7px">Your sample products and demo transactions will be removed.</div></div>`,`<div class="modal-actions"><button class="secondary" onclick="closeModal()">Keep demo</button><button class="danger" onclick="doExitDemo()">Exit demo</button></div>`)}
function doExitDemo(){state.products=[];state.transactions=[];state.demo=false;save();closeModal();go('dashboard');toast('Demo cleared — your inventory is ready')}
function exportData(){const backup={...structuredClone(state),backupVersion:1,app:'TallyO',exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tallyo-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup saved')}
function normalizeImportedState(x){
  if(!x||typeof x!=='object')throw new Error('The file does not contain a valid TallyO backup.');
  const imported={...structuredClone(DEFAULT),...x};
  if(!Array.isArray(imported.products)||!Array.isArray(imported.transactions))throw new Error('This does not look like a TallyO backup.');
  imported.products=imported.products.filter(p=>p&&typeof p==='object').map(p=>({
    id:String(p.id||uid()),name:String(p.name||'Unnamed product'),category:String(p.category||'General'),sku:String(p.sku||''),
    qty:Math.max(0,Number(p.qty)||0),unit:String(p.unit||'pieces'),cost:Math.max(0,Number(p.cost)||0),price:Math.max(0,Number(p.price)||0),
    threshold:Math.max(0,Number(p.threshold)||0),note:String(p.note||''),image:String(p.image||'')
  }));
  const ids=new Set(imported.products.map(p=>p.id));
  imported.transactions=imported.transactions.filter(t=>t&&typeof t==='object'&&ids.has(String(t.productId))).map(t=>({
    id:String(t.id||uid()),type:t.type==='out'?'out':'in',productId:String(t.productId),qty:Math.max(0,Number(t.qty)||0),date:t.date||new Date().toISOString(),note:String(t.note||'')
  }));
  imported.setup=imported.setup&&typeof imported.setup==='object'?{businessName:String(imported.setup.businessName||'My Business'),businessType:String(imported.setup.businessType||'retail')}:null;
  imported.theme=imported.theme==='dark'?'dark':'light';
  imported.demo=Boolean(imported.demo);
  imported.tourSeen=Boolean(imported.tourSeen);
  delete imported.backupVersion;delete imported.app;delete imported.exportedAt;
  return imported;
}
function importData(input){
  const file=input?.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imported=normalizeImportedState(JSON.parse(reader.result));
      const productCount=imported.products.length,txCount=imported.transactions.length;
      openModal('Import this backup?',`<div class="confirm-box"><div class="warning">${icon('warning')}</div><strong>This will replace the TallyO data currently on this device.</strong><div class="muted" style="margin-top:7px">The backup contains ${productCount} product${productCount===1?'':'s'} and ${txCount} transaction${txCount===1?'':'s'}. Your current data will be replaced only after you confirm.</div></div>`,`<div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="finishImport(window.__pendingTallyOImport)">Import backup</button></div>`);
      window.__pendingTallyOImport=imported;
    }catch(err){toast(err.message||'Could not import that backup')}
    input.value='';
  };
  reader.onerror=()=>{toast('Could not read that backup file');input.value=''};
  reader.readAsText(file);
}
function finishImport(imported){
  if(!imported){toast('Nothing to import');return}
  state=imported;window.__pendingTallyOImport=null;localStorage.setItem('tallyo_state',JSON.stringify(state));closeModal();currentPage='dashboard';inventorySearch='';inventoryCategory='all';settingsTab='general';applyTheme();render();toast('Backup imported successfully');
}
function confirmReset(){openModal('Start TallyO over',`<div class="confirm-box"><div class="warning">${icon('warning')}</div><strong>This cannot be undone.</strong><div class="muted" style="margin-top:7px">All business settings, products and transactions stored in this browser will be deleted.</div></div>`,`<div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="danger" onclick="resetAll()">Clear everything</button></div>`)}
function resetAll(){localStorage.removeItem('tallyo_state');state=structuredClone(DEFAULT);onboardingStep=0;closeModal();render();toast('TallyO has been reset')}

/* ================= GUIDED FIRST-RUN TOUR ================= */
const tourSteps=[
  {selector:'[data-tour="quick"]',title:'Shortcuts',text:'These are the things you will do most: add a product, record a buy, or record a sale.'},
  {selector:'[data-tour="nav-inventory"]',title:'Your products',text:'This is where all the things you sell live. Tap one to see its details, buy more, sell it, or edit it.'},
  {selector:'[data-tour="nav-transactions"]',title:'Sales & buys',text:'See what you bought and sold, and when it happened.'},
  {selector:'[data-tour="theme"]',title:'Make TallyO yours',text:'Use this button to switch between light and dark mode. Your choice is saved automatically.'},
  {selector:'[data-tour="nav-settings"]',title:'Settings',text:'Change your business details, appearance, backup, and other settings here.'}
];
let tourIndex=0;
function markTourTargets(){
  document.querySelectorAll('.nav button,.mobile-nav button').forEach(b=>{
    const label=(b.textContent||'').trim().toLowerCase();
    if(label.includes('products'))b.dataset.tour='nav-inventory';
    if(label.includes('sales')||label.includes('buys'))b.dataset.tour='nav-transactions';
    if(label.includes('settings'))b.dataset.tour='nav-settings';
  });
}
function startTour(){
  if(state.tourSeen||!state.setup)return;
  markTourTargets();tourIndex=0;showTourStep();
}
function showTourStep(){
  const step=tourSteps[tourIndex];let target=document.querySelector(step.selector);if(target&&target.offsetParent===null){target=[...document.querySelectorAll(step.selector)].find(el=>el.offsetParent!==null)||target;}
  if(!target){tourIndex++;if(tourIndex<tourSteps.length)showTourStep();else finishTour();return}
  document.getElementById('tourLayer').innerHTML=`<div class="tour-dim" onclick="finishTour()"></div><div class="tour-highlight"></div><div class="tour-card"><div class="tour-progress">${tourIndex+1} of ${tourSteps.length}</div><h3>${step.title}</h3><p>${step.text}</p><div class="tour-actions"><button class="tour-skip" onclick="finishTour()">Skip</button><button class="tour-next" onclick="nextTourStep()">${tourIndex===tourSteps.length-1?'Done':'Next'}</button></div></div>`;
  requestAnimationFrame(()=>positionTour(target));
}
function positionTour(target){
  const layer=document.getElementById('tourLayer');if(!layer)return;
  const h=layer.querySelector('.tour-highlight'),c=layer.querySelector('.tour-card');const r=target.getBoundingClientRect();
  h.style.left=(r.left-5)+'px';h.style.top=(r.top-5)+'px';h.style.width=(r.width+10)+'px';h.style.height=(r.height+10)+'px';
  if(innerWidth<=720){c.style.left='14px';c.style.right='14px';c.style.bottom='82px';c.style.top='auto'}else{
    const cw=Math.min(340,innerWidth-28);let left=r.left,top=r.bottom+14;
    if(left+cw>innerWidth-14)left=innerWidth-cw-14;
    if(top+190>innerHeight-14)top=Math.max(14,r.top-205);
    c.style.left=Math.max(14,left)+'px';c.style.top=top+'px';c.style.bottom='auto';
  }
}
function nextTourStep(){tourIndex++;if(tourIndex>=tourSteps.length){finishTour();return}showTourStep()}
function finishTour(){state.tourSeen=true;save();const layer=document.getElementById('tourLayer');if(layer)layer.innerHTML='';toast('TallyO is ready for you')}
window.addEventListener('resize',()=>{if(document.querySelector('.tour-card')){const step=tourSteps[tourIndex],target=document.querySelector(step?.selector);if(target)positionTour(target)}});

// Startup: fresh users see onboarding; returning users continue exactly where they left off.
function boot(){state=load();applyTheme();render()}
boot();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('TallyO offline mode ready', reg.scope))
      .catch(err => console.error('TallyO service worker failed:', err));
  });
}
</script>
